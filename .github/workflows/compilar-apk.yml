name: Compilar APK Control Geomembrana
on:
  push:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Pruebas de cálculos
        run: gradle testDebugUnitTest --no-daemon
      - name: Llave de firma (secretos de GitHub si existen; si no, la del repositorio)
        env:
          FIRMA_JKS_BASE64: ${{ secrets.FIRMA_JKS_BASE64 }}
        run: |
          if [ -n "$FIRMA_JKS_BASE64" ]; then
            echo "$FIRMA_JKS_BASE64" | base64 -d > "$RUNNER_TEMP/firma.jks"
            echo "FIRMA_ARCHIVO=$RUNNER_TEMP/firma.jks" >> "$GITHUB_ENV"
          fi
      - name: Compilar APK firmado
        env:
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Verificar firma del APK
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          for f in app/build/outputs/apk/release/*.apk; do
            "$APKSIGNER" verify --print-certs "$f" | tee firma.txt
            grep -q "SHA-256 digest: 26bb9778734bc68dac3d2d0f3598e1e4d8e8a721e2c689b4ca5c7ca7e25fb561" firma.txt \
              || { echo "::error::El APK no quedó firmado con la llave del proyecto"; exit 1; }
            mv "$f" "app/build/outputs/apk/release/ControlGeomembrana-v1.1.$((GITHUB_RUN_NUMBER + 10)).apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ControlGeomembrana-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

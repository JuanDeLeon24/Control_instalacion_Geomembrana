name: Compilar APK Control Geomembrana
on:
  push:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Preparar llave de firma (si está configurada)
        env:
          FIRMA_JKS_BASE64: ${{ secrets.FIRMA_JKS_BASE64 }}
        run: |
          if [ -n "$FIRMA_JKS_BASE64" ]; then
            echo "$FIRMA_JKS_BASE64" | base64 -d > "$RUNNER_TEMP/firma.jks"
            echo "FIRMA_ARCHIVO=$RUNNER_TEMP/firma.jks" >> "$GITHUB_ENV"
            echo "Se firmará con la llave del proyecto."
          else
            echo "::warning::No está el secreto FIRMA_JKS_BASE64: el APK se firma con una llave de depuración y no se podrá instalar encima de otra versión. Ver README."
          fi
      - name: Pruebas de cálculos
        run: gradle testDebugUnitTest --no-daemon
      - name: Compilar
        env:
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ControlGeomembrana-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
